openapi: 3.0.3
info:
  title: API TravelX - Plataforma Completa de Turismo
  version: 2.0.0
  description: |
    API completa para plataforma de turismo com funcionalidades para turistas e guias.
    
    **Funcionalidades principais:**
    - Autenticação via Bearer Token (Sanctum)
    - Sistema completo de reservas (acomodações e atividades)
    - Listagem e busca de destinos, acomodações, restaurantes e atividades
    - Sistema de avaliações e reviews
    - Compartilhamento de experiências
    - Comunidade com posts e comentários
    - Upload de documentos e imagens
    - Recomendações personalizadas
    - Comparação de preços e qualidade
    
    **Tipos de usuário:** administrador, guiaTurista, turista
    
    **Novos endpoints de listagem:**
    - Filtros avançados por preço, tipo, classificação
    - Paginação e ordenação personalizável
    - Busca geral em múltiplos campos
    - Relacionamentos com imagens e avaliações
servers:
  - url: http://localhost/api/v1
    description: Localhost

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        sobrenome:
          type: string
        email:
          type: string
        tipo_usuario:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
    Documento:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        tipo_documento:
          type: string
        nome_arquivo:
          type: string
        caminho_arquivo:
          type: string
        tamanho_arquivo:
          type: integer
        formato_arquivo:
          type: string
        status_analise:
          type: string
        comentario_analise:
          type: string
    AuthToken:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        user:
          $ref: '#/components/schemas/User'
    
    Destino:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        pais:
          type: string
        regiao:
          type: string
        descricao:
          type: string
        latitude:
          type: number
          format: float
        longitude:
          type: number
          format: float
        clima:
          type: string
        moeda:
          type: string
        idioma:
          type: string
        imagem_principal:
          type: string
        total_acomodacoes:
          type: integer
        total_atividades:
          type: integer
        total_restaurantes:
          type: integer
        avaliacao_media:
          type: number
          format: float
        total_avaliacoes:
          type: integer
        imagens:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
    
    Acomodacao:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        tipo:
          type: string
        telefone:
          type: string
        email:
          type: string
        preco_medio_noite:
          type: number
          format: float
        estrelas:
          type: integer
        facilidades:
          type: string
        destino:
          type: object
          properties:
            id:
              type: integer
            nome:
              type: string
            pais:
              type: string
            regiao:
              type: string
        endereco:
          type: object
          properties:
            id:
              type: integer
            logradouro:
              type: string
            numero:
              type: string
            bairro:
              type: string
            cidade:
              type: string
            estado:
              type: string
            cep:
              type: string
        avaliacao_media:
          type: number
          format: float
        total_avaliacoes:
          type: integer
        total_reservas:
          type: integer
        disponivel:
          type: boolean
        imagens:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
    
    Restaurante:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        tipo_cozinha:
          type: string
        telefone:
          type: string
        email:
          type: string
        preco_medio_refeicao:
          type: number
          format: float
        classificacao:
          type: integer
        horario_funcionamento:
          type: string
        destino:
          type: object
          properties:
            id:
              type: integer
            nome:
              type: string
            pais:
              type: string
            regiao:
              type: string
        endereco:
          type: object
          properties:
            id:
              type: integer
            logradouro:
              type: string
            numero:
              type: string
            bairro:
              type: string
            cidade:
              type: string
            estado:
              type: string
            cep:
              type: string
        avaliacao_media:
          type: number
          format: float
        total_avaliacoes:
          type: integer
        aberto_agora:
          type: boolean
        imagens:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
    
    Atividade:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        tipo:
          type: string
        descricao:
          type: string
        duracao:
          type: string
        preco:
          type: number
          format: float
        horario:
          type: string
        destino:
          type: object
          properties:
            id:
              type: integer
            nome:
              type: string
            pais:
              type: string
            regiao:
              type: string
        avaliacao_media:
          type: number
          format: float
        total_avaliacoes:
          type: integer
        total_reservas:
          type: integer
        disponivel:
          type: boolean
        imagens:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        criado_em:
          type: string
          format: date-time
        atualizado_em:
          type: string
          format: date-time
    
    Image:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
        nome_arquivo:
          type: string
        tamanho:
          type: integer
        tipo:
          type: string
        descricao:
          type: string
        criado_em:
          type: string
          format: date-time
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        links:
          type: object
          properties:
            first:
              type: string
            last:
              type: string
            prev:
              type: string
            next:
              type: string
        meta:
          type: object
          properties:
            current_page:
              type: integer
            from:
              type: integer
            last_page:
              type: integer
            per_page:
              type: integer
            to:
              type: integer
            total:
              type: integer

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      summary: Registro de novo usuário
      tags: [Auth]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - sobrenome
                - email
                - password
                - tipo_usuario
              properties:
                name:
                  type: string
                sobrenome:
                  type: string
                email:
                  type: string
                password:
                  type: string
                tipo_usuario:
                  type: string
                  enum: [administrador, guiaTurista, turista]
                documentos:
                  type: array
                  items:
                    type: object
                    properties:
                      tipo_documento:
                        type: string
                        enum: [Passaporte, Documento_Identidade, Licenca_Guia]
                      arquivo:
                        type: string
                        format: binary
                perfil_profissional:
                  type: object
                  properties:
                    nome:
                      type: string
      responses:
        '201':
          description: Usuário registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '422':
          description: Erro de validação
  /auth/login:
    post:
      summary: Login do usuário
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Login realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthToken'
        '422':
          description: Erro de validação
  /user:
    get:
      summary: Retorna o usuário autenticado
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Não autenticado
  /auth/logout:
    post:
      summary: Logout do usuário
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout realizado com sucesso
        '401':
          description: Não autenticado
  /auth/forgot-password:
    post:
      summary: Solicita link de redefinição de senha
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Link de redefinição enviado
        '422':
          description: Erro de validação
  /auth/reset-password:
    post:
      summary: Redefine a senha usando o token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - token
                - password
                - password_confirmation
              properties:
                email:
                  type: string
                token:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Senha redefinida com sucesso
        '400':
          description: Token inválido ou expirado
        '422':
          description: Erro de validação
  /lugares-proximos:
    get:
      summary: Consulta lugares próximos
      tags: [Lugares]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: latitude
          schema:
            type: number
          required: true
        - in: query
          name: longitude
          schema:
            type: number
          required: true
        - in: query
          name: raio
          schema:
            type: number
          required: false
          description: Raio em km (padrão 50)
      responses:
        '200':
          description: Listagem de lugares próximos
          content:
            application/json:
              schema:
                type: object
                properties:
                  paisagens:
                    type: array
                    items:
                      type: object
                  acomodacoes:
                    type: array
                    items:
                      type: object
                  restaurantes:
                    type: array
                    items:
                      type: object
                  eventos:
                    type: array
                    items:
                      type: object
        '401':
          description: Não autenticado
  /turista/perfil:
    get:
      summary: Visualizar perfil do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dados do perfil
    put:
      summary: Atualizar perfil do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                sobrenome:
                  type: string
                telefone:
                  type: string
                data_nascimento:
                  type: string
                  format: date
                genero:
                  type: string
                  enum: [Masculino, Feminino, Outro]
      responses:
        '200':
          description: Perfil atualizado

  /turista/documentos:
    get:
      summary: Listar documentos do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de documentos
    post:
      summary: Upload de documento do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - tipo_documento
                - arquivo
              properties:
                tipo_documento:
                  type: string
                  enum: [Passaporte, Documento_Identidade, Licenca_Guia]
                arquivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Documento enviado

  /turista/idiomas:
    get:
      summary: Listar idiomas do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de idiomas
    put:
      summary: Atualizar idiomas do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - idiomas
              properties:
                idiomas:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - nivel
                    properties:
                      id:
                        type: integer
                      nivel:
                        type: string
                        enum: [Basico, Intermediario, Avancado, Nativo]
      responses:
        '200':
          description: Idiomas atualizados

  /turista/enderecos:
    get:
      summary: Listar endereços do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de endereços
    put:
      summary: Atualizar endereços do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enderecos
              properties:
                enderecos:
                  type: array
                  items:
                    type: object
                    required:
                      - logradouro
                      - numero
                      - bairro
                      - cidade
                      - estado
                      - cep
                      - pais
                    properties:
                      logradouro:
                        type: string
                      numero:
                        type: string
                      bairro:
                        type: string
                      cidade:
                        type: string
                      estado:
                        type: string
                      cep:
                        type: string
                      pais:
                        type: string
      responses:
        '200':
          description: Endereços atualizados
  /turista/reservas:
    get:
      summary: Listar reservas do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de reservas
    post:
      summary: Criar nova reserva
      tags: [Turista]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - data_inicio
                - data_fim
                - quantidade_pessoas
              properties:
                acomodacao_id:
                  type: integer
                  description: ID da acomodação (opcional se for atividade)
                atividade_id:
                  type: integer
                  description: ID da atividade (opcional se for acomodação)
                data_inicio:
                  type: string
                  format: date
                data_fim:
                  type: string
                  format: date
                quantidade_pessoas:
                  type: integer
                valor_total:
                  type: number
                  format: float
      responses:
        '201':
          description: Reserva criada

  /turista/reservas/{id}:
    get:
      summary: Detalhar reserva
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da reserva
    put:
      summary: Atualizar reserva
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_inicio:
                  type: string
                  format: date
                data_fim:
                  type: string
                  format: date
                quantidade_pessoas:
                  type: integer
                status:
                  type: string
                  enum: [pendente, confirmada, cancelada]
      responses:
        '200':
          description: Reserva atualizada
    delete:
      summary: Cancelar reserva
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva cancelada

  /turista/avaliacoes:
    get:
      summary: Listar avaliações do turista
      tags: [Turista]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de avaliações
    post:
      summary: Criar avaliação
      tags: [Turista]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nota
              properties:
                nota:
                  type: integer
                  minimum: 1
                  maximum: 5
                comentario:
                  type: string
                destino_id:
                  type: integer
                acomodacao_id:
                  type: integer
                atividade_id:
                  type: integer
                restaurante_id:
                  type: integer
      responses:
        '201':
          description: Avaliação criada

  /turista/avaliacoes/{id}:
    get:
      summary: Detalhar avaliação
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalhes da avaliação
    put:
      summary: Atualizar avaliação
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nota:
                  type: integer
                  minimum: 1
                  maximum: 5
                comentario:
                  type: string
      responses:
        '200':
          description: Avaliação atualizada
    delete:
      summary: Excluir avaliação
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Avaliação excluída

  /turista/acomodacoes/{id}/imagens:
    post:
      summary: Upload de imagem para acomodação
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imagem
              properties:
                imagem:
                  type: string
                  format: binary
                descricao:
                  type: string
      responses:
        '201':
          description: Imagem enviada
    get:
      summary: Listar imagens da acomodação
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de imagens

  /turista/atividades/{id}/imagens:
    post:
      summary: Upload de imagem para atividade
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imagem
              properties:
                imagem:
                  type: string
                  format: binary
                descricao:
                  type: string
      responses:
        '201':
          description: Imagem enviada
    get:
      summary: Listar imagens da atividade
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de imagens

  /turista/destinos/{id}/imagens:
    post:
      summary: Upload de imagem para destino
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imagem
              properties:
                imagem:
                  type: string
                  format: binary
                descricao:
                  type: string
      responses:
        '201':
          description: Imagem enviada
    get:
      summary: Listar imagens do destino
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de imagens

  /turista/restaurantes/{id}/imagens:
    post:
      summary: Upload de imagem para restaurante
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - imagem
              properties:
                imagem:
                  type: string
                  format: binary
                descricao:
                  type: string
      responses:
        '201':
          description: Imagem enviada
    get:
      summary: Listar imagens do restaurante
      tags: [Turista]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Lista de imagens

  /turista/destinos:
    get:
      summary: Listar destinos disponíveis
      tags: [Turista - Listagem]
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: nome
          schema:
            type: string
          description: Filtrar por nome do destino
        - in: query
          name: pais
          schema:
            type: string
          description: Filtrar por país
        - in: query
          name: regiao
          schema:
            type: string
          description: Filtrar por região
        - in: query
          name: busca
          schema:
            type: string
          description: Busca geral (nome, descrição, país, região)
        - in: query
          name: ordenar_por
          schema:
            type: string
            enum: [nome, pais, regiao, created_at]
            default: nome
          description: Campo para ordenação
        - in: query
          name: ordem
          schema:
            type: string
            enum: [asc, desc]
            default: asc
          description: Direção da ordenação
        - in: query
          name: per_page
          schema:
